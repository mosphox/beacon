services:
  init-volume:
    image: alpine:3.21
    container_name: beacon-init-volume
    volumes:
      - beacon-data:/app/data
    # chmod without -R, and 700. The recursive 755 ran on every `up` and
    # flattened what CertMagic deliberately creates as 0700, leaving the ACME
    # account key and the TLS private keys world-readable inside the volume.
    command: sh -c "chown -R 1000:1000 /app/data && chmod 700 /app/data"
    restart: "no"

  frontend:
    build: ./frontend
    container_name: beacon-frontend
    # Guard rails, not tuning. Actual use is ~5 MiB for the backend (the mmdb
    # files are mmap'd, not read) and ~40 MiB for Next; these are far above
    # that and exist so a leak or an attack cannot take the host with it.
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    expose:
      - "3000"
    logging:
      options:
        max-size: "10m"
        max-file: "1"

  backend:
    build: ./backend
    container_name: beacon-backend
    # Guard rails, not tuning. Actual use is ~5 MiB for the backend (the mmdb
    # files are mmap'd, not read) and ~40 MiB for Next; these are far above
    # that and exist so a leak or an attack cannot take the host with it.
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    depends_on:
      init-volume:
        condition: service_completed_successfully
      frontend:
        condition: service_started
    environment:
      - DATA_DIR=/app/data
      - LISTEN_ADDR=${LISTEN_ADDR:-:8000}
      - TLS_LISTEN_ADDR=${TLS_LISTEN_ADDR:-:8443}
      - FRONTEND_URL=${FRONTEND_URL-http://frontend:3000}
      - GEOIP_UPDATE_INTERVAL_HOURS=${GEOIP_UPDATE_INTERVAL_HOURS:-12}
      # GeoIP sources. These four need no account; MaxMind and IPinfo are
      # optional. RIPE gives the registered country only; geofeeds need RIPE.
      - DBIP_ENABLED=${DBIP_ENABLED:-true}
      - IPLOCATE_ENABLED=${IPLOCATE_ENABLED:-true}
      - RIPE_ENABLED=${RIPE_ENABLED:-true}
      - GEOFEEDS_ENABLED=${GEOFEEDS_ENABLED:-true}
      - MAXMIND_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID:-}
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
      - IPINFO_TOKEN=${IPINFO_TOKEN:-}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - RDNS_ENABLED=${RDNS_ENABLED:-true}
      - RDNS_TIMEOUT_MS=${RDNS_TIMEOUT_MS:-300}
      - RDNS_CACHE_TTL_SECONDS=${RDNS_CACHE_TTL_SECONDS:-3600}
      # TLS terminated here, certificates via ACME DNS-01 over Cloudflare.
      - TLS_ENABLED=${TLS_ENABLED:-false}
      - DOMAIN=${DOMAIN:-}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - CF_ZONE_TOKEN=${CF_ZONE_TOKEN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - ACME_CA=${ACME_CA:-}
      - PROXY_PROTOCOL=${PROXY_PROTOCOL:-false}
    volumes:
      - beacon-data:/app/data
    healthcheck:
      # A first start on an empty volume downloads one database before it
      # listens; start_period keeps that from counting as failure.
      test: ["CMD", "/app/beacon", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-11001}:8000"
      # Publish the TLS listener only when TLS_ENABLED=true. Keep it on
      # loopback: the edge proxy passes TLS through to it, nothing else should
      # reach it. Set TLS_PUBLISH=127.0.0.1:8443:8443 in .env to enable.
      - "${TLS_PUBLISH:-127.0.0.1:0:8443}"
    logging:
      options:
        max-size: "10m"
        max-file: "1"

volumes:
  beacon-data:
